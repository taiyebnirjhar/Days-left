# Push to main (or run manually) -> builds the APK and publishes release v<versionName>, creating the tag.
# Skips if that release already exists, so bump versionName in app/build.gradle for each update.
# The in-app "Check for update" reads that release.
# One-time setup: repo secret SIGNING_PASSPHRASE (short text) decrypts signing/dl.keystore.enc. Never change the key: updates would stop installing.
name: release
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install NDK + CMake
        run: |
          SM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Signing key
        env: { PASS: '${{ secrets.SIGNING_PASSPHRASE }}' }
        run: |
          if [ -z "$PASS" ]; then echo "::error::Missing secret SIGNING_PASSPHRASE (a short passphrase; the keystore itself is signing/dl.keystore.enc)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:PASS -in signing/dl.keystore.enc -out "$RUNNER_TEMP/dl.keystore" || { echo "::error::SIGNING_PASSPHRASE is wrong (could not decrypt signing/dl.keystore.enc). Check it for typos."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/dl.keystore" -storepass android > /dev/null || { echo "::error::decrypted file is not a valid keystore"; exit 1; }
          echo "DAYSLEFT_KEYSTORE=$RUNNER_TEMP/dl.keystore" >> $GITHUB_ENV
      - name: Version and skip check
        id: v
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "tag=v$v" >> $GITHUB_OUTPUT
          if gh release view "v$v" >/dev/null 2>&1; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - if: steps.v.outputs.skip == 'false'
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - name: Check the APK is signed with the key from the secret
        if: steps.v.outputs.skip == 'false'
        run: |
          want=$(keytool -list -v -keystore "$RUNNER_TEMP/dl.keystore" -storepass android | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          got=$($AS verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA-256 digest" | sed 's/.*: *//' | tr 'A-F' 'a-f')
          echo "key in secret: $want"; echo "key in APK:    $got"
          [ "$want" = "$got" ] || { echo "::error::APK is not signed with the key from SIGNING_PASSPHRASE"; exit 1; }
      - if: steps.v.outputs.skip == 'false'
        run: cp app/build/outputs/apk/debug/app-debug.apk DaysLeft-${{ steps.v.outputs.tag }}.apk
      - if: steps.v.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: DaysLeft-*.apk
          generate_release_notes: true
