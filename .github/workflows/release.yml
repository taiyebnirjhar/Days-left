# Push a tag like v3.18 -> builds the APK and publishes it as a GitHub Release.
# The in-app "Check for update" reads that release.
# One-time setup: add repo secret DEBUG_KEYSTORE_B64 = base64 of the keystore your installed app is signed with
# (default: ~/.android/debug.keystore), so updates install over the existing app.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Signing key
        env: { KS: '${{ secrets.DEBUG_KEYSTORE_B64 }}' }
        run: |
          if [ -z "$KS" ]; then echo "::error::Missing secret DEBUG_KEYSTORE_B64"; exit 1; fi
          mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
      - name: Check tag matches versionName
        run: |
          v=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != versionName $v"; exit 1; }
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - run: cp app/build/outputs/apk/debug/app-debug.apk DaysLeft-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: DaysLeft-*.apk
          generate_release_notes: true
