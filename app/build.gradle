plugins { id 'com.android.application' }
android {
    namespace 'com.taiyeb.daysleft'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.taiyeb.daysleft'
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName '3.19'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0' }
