plugins { id 'com.android.application' }
android {
    namespace 'com.taiyeb.daysleft'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.taiyeb.daysleft'
        minSdk 26
        targetSdk 35
        versionCode 53
        versionName '3.39'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    // Releases are signed with a fixed key (CI writes it to DAYSLEFT_KEYSTORE). Without this, every build got a fresh random
    // debug key and Android refused to install one release over another.
    if (System.getenv('DAYSLEFT_KEYSTORE')) {
        signingConfigs {
            debug {
                storeFile file(System.getenv('DAYSLEFT_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0' }
